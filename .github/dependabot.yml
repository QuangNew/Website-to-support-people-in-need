version: 2

# Keep each manifest family in its own resolver job. The previous
# multi-ecosystem group had to resolve two pnpm lockfiles, four NuGet projects,
# and GitHub Actions before it could create one PR, which made the update job
# unnecessarily large and left all ecosystems blocked behind a one-PR limit.
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    groups:
      client-production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      client-development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 14
      semver-major-days: 21
      semver-minor-days: 14
      semver-patch-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    groups:
      root-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 14
      semver-major-days: 21
      semver-minor-days: 14
      semver-patch-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "nuget"
    directories:
      - "/src/ReliefConnect.API"
      - "/src/ReliefConnect.Core"
      - "/src/ReliefConnect.Infrastructure"
      - "/src/ReliefConnect.Tests"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    groups:
      backend-nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 14
      semver-major-days: 21
      semver-minor-days: 14
      semver-patch-days: 7
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
